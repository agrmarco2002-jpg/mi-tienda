<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda | Playeras</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .hero {
            padding: 70px 20px;
            text-align: center;
            background: white;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .boton {
            display: inline-block;
            background: #111;
            color: white;
            padding: 14px 25px;
            text-decoration: none;
            border-radius: 5px;
        }

        .productos {
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .productos h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .producto {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .producto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            background: #ddd;
        }

        .producto h3 {
            margin: 15px 0 8px;
        }

        .precio {
            font-weight: bold;
            margin-bottom: 15px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>MI MARCA</h1>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#playeras">Playeras</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

<section class="hero" id="inicio">
    <h2>VISTE TU ESTILO</h2>
    <p>Playeras creadas para quienes tienen su propia identidad.</p>

    <a href="#playeras" class="boton">
        VER PLAYERAS
    </a>
</section>

<section class="productos" id="playeras">

    <h2>COLECCIÓN</h2>

    <div class="grid">

        <div class="producto">
            <img src="https://via.placeholder.com/500x600" alt="Playera 1">

            <h3>Playera Modelo 01</h3>

            <p class="precio">$399 MXN</p>

            <a class="boton" href="https://wa.me/5210000000000">
                PEDIR
            </a>
        </div>

        <div class="producto">
            <img src="https://via.placeholder.com/500x600" alt="Playera 2">

            <h3>Playera Modelo 02</h3>

            <p class="precio">$399 MXN</p>

            <a class="boton" href="https://wa.me/5210000000000">
                PEDIR
            </a>
        </div>

        <div class="producto">
            <img src="https://via.placeholder.com/500x600" alt="Playera 3">

            <h3>Playera Modelo 03</h3>

            <p class="precio">$399 MXN</p>

            <a class="boton" href="https://wa.me/5210000000000">
                PEDIR
            </a>
        </div>

    </div>

</section>

<footer id="contacto">
    <p>© 2026 Mi Marca</p>
    <p>Instagram · TikTok · WhatsApp</p>
</footer>

</body>
</html>
